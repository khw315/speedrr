# ==============================================================================
# YouTube Network Traffic Monitor Configuration
# ==============================================================================

# Interface jaringan fisik host (e.g. eth0, br0, enp3s0, bond0)
interface: "eth0"

# Daftar IP perangkat target di LAN yang dipantau pemakaian YouTube-nya
target_ips:
  - "192.168.1.50" # Contoh: Apple TV / Android TV
  - "192.168.1.51" # Contoh: Smart TV Ruang Tamu

# Gateway atau DNS IP (opsional)
gateway_ip: "192.168.1.1"

# Webhook tujuan untuk notifikasi perubahan status
webhook_url: "http://127.0.0.1:8080/api/v1/webhook/stream"

# Cooldown timeout (dalam detik): durasi jeda sebelum status kembali menjadi IDLE
cooldown_seconds: 30

# Mode promiscuous pcap
promiscuous: true

# Snapshot length paket
snaplen: 65535

# Debug mode logging
debug: false
