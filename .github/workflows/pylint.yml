name: Pylint

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install pip==25.0.1
          pip install --only-binary :all: pylint==3.3.4 dataclass_wizard==1.0.0 PyYAML==6.0.3 qbittorrent-api==2026.8.0 transmission-rpc==7.0.12 httpx==0.28.1 colorama==0.4.6

      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py')
