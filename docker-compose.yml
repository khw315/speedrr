version: "3.8"

services:
  # ============================================================================
  # SPEEDRR - Bandwidth & Dynamic Torrent Speed Manager
  # ============================================================================
  speedrr:
    build:
      context: .
      dockerfile: Dockerfile
    image: speedrr:latest
    container_name: speedrr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs

  # ============================================================================
  # YOUTUBE NETWORK MONITOR - Promiscuous Sniffer & Subnet SNI Parser Sidecar
  # ============================================================================
  youtube-monitor:
    build:
      context: ./sidecars/youtube-monitor
      dockerfile: Dockerfile
    image: speedrr-youtube-monitor:latest
    container_name: speedrr-youtube-monitor
    restart: unless-stopped
    # Host network mode is required to capture raw packets from host/LAN interfaces
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - MONITOR_INTERFACE=eth0                         # Physical host interface (e.g. eth0, br0, enp3s0)
      - TARGET_IPS=192.168.1.50                        # Specific target IP (optional)
      - TARGET_SUBNETS=192.168.1.0/24,10.0.10.0/24     # Subnet / CIDR ranges to monitor
      - WEBHOOK_URL=http://127.0.0.1:8080/api/v1/webhook/stream
      - COOLDOWN_SECONDS=30
      - PROMISCUOUS=true
      - DEBUG=false
    volumes:
      - ./sidecars/youtube-monitor/config.example.yaml:/app/config.yaml:ro
    depends_on:
      - speedrr
